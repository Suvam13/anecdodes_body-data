<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surveillance Stories — Dangling Cards</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Styles (order matters: tokens first, then base, then components, then animations) -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/stage.css" />
    <link rel="stylesheet" href="css/card.css" />
    <link rel="stylesheet" href="css/depth.css" />
    <link rel="stylesheet" href="css/swing.css" />
    <link rel="stylesheet" href="css/breeze.css" />
  </head>
  <body>
    <!-- Site header (title + description, sits on the gallery wall) -->
    <header class="site-header">
      <h1 class="site-title">Anecdotes</h1>
      <p class="site-desc">These are stories from people on the internet</p>
    </header>

    <!-- Top rail (wooden batten the yarn hangs from, sits just below the header) -->
    <div class="top-rail"></div>

    <!-- Stage: horizontal scroll viewport containing the row of hangers -->
    <div class="stage" id="stage">
      <div class="row" id="row"></div>
    </div>

    <!-- Footer hint -->
    <div class="footer-hint">
      Scroll horizontally · Tap a card to flip · English → नेपाली
    </div>

    <!-- Entry point (ES module) -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
